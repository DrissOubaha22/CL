name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AEGIS_TEST_DSN: postgresql+psycopg://aegis:aegis@localhost:5432/aegis_test
      AEGIS_DATABASE_DSN: postgresql+psycopg://aegis:aegis@localhost:5432/aegis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Format check
        run: ruff format --check src tests
      - name: Types
        run: mypy
      - name: Global migrations apply cleanly
        run: alembic upgrade head
      - name: Tests
        run: pytest -v --cov=aegis --cov-report=term-missing
