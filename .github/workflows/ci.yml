name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AEGIS_TEST_DSN: postgresql+psycopg://aegis:aegis@localhost:5432/aegis_test
      AEGIS_DATABASE_DSN: postgresql+psycopg://aegis:aegis@localhost:5432/aegis_test
      # The verification tests drive a stub prober; this makes a stray real
      # probe fail loudly rather than reach the internet from CI.
      AEGIS_VERIFICATION_ALLOW_PRIVATE_TARGETS: "false"
      # The bulletin and extraction tests drive a stub model; this makes a
      # stray real call fail loudly rather than bill an account from CI.
      AEGIS_LLM_ENABLED: "false"
      # The API tests supply their own token verifier, but create_app
      # refuses to start without an issuer, so give it one.
      AEGIS_OIDC_ISSUER: "https://idp.invalid"
      AEGIS_OIDC_AUDIENCE: "aegis-api"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Format check
        run: ruff format --check src tests
      - name: Types
        run: mypy
      - name: Global migrations apply cleanly
        run: alembic upgrade head
      - name: Tests
        run: pytest -v --cov=aegis --cov-report=term-missing

      # Spec §11 asks for these by name: "automated cross-tenant access
      # tests in CI". Already covered by the run above; named separately so
      # a failure says what broke.
      - name: Cross-tenant isolation
        run: |
          pytest -v \
            tests/integration/test_tenancy.py \
            tests/integration/test_isolation.py \
            tests/integration/test_api.py::TestCrossTenant
