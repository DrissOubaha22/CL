[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.1.0"
description = "Aegis - Vulnerability Threat Intelligence platform (intel core)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "tenacity>=8.2",
    "structlog>=24.1",
    "typer>=0.12",
    "celery[redis]>=5.4",
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-python-dateutil",
]

[project.scripts]
aegis = "aegis.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live PostgreSQL database (AEGIS_TEST_DSN)",
]
filterwarnings = ["error::DeprecationWarning:aegis.*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
packages = ["aegis"]
mypy_path = "src"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Celery ships no py.typed marker, so its decorators erase our annotations.
module = ["celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aegis.tasks"]
disallow_untyped_decorators = false
